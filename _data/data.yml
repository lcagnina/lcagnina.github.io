        - Advisors: Dr Coello Coello Carlos (CINVESTAV-Instituto Politécnico Nacional, México) & Susana Esquivel (UNSL)
  - degree: MSc in Computer Science
    university: Universidad Nacional de San Luis (Argentina)
    time: 2007
    details: |
        - Thesis: Optimización, a través de Heurísticas de Inteligencia Colectiva, en Ambientes Estacionarios y no Estacionarios
        - Advisors: Dr Coello Coello Carlos (CINVESTAV-Instituto Politécnico Nacional, México) & Susana Esquivel (UNSL)
  - degree: BSc (Licenciatura) in Computer Science
    university: Universidad Nacional de San Luis (Argentina)
    time: 2003
    details: |
        - Thesis: Evaluación de Técnicas de Reconstrucción de Terrenos a través de una Técnica de Visión.
        - Advisor: MSc Roberto Ariel Guerrero (UNSL). 

experiences:
  title: Experiences
  info:
  - role: Associate Researcher
    time: 2018 - Present
    company: National Scientific and Technical Research Council (CONICET), Argentina
    details: |
      Research Scientist in Scientific and Technological Research Career (CIC)
  - role: Professor
    time: 2014 - Present
    company: Universidad Nacional de San Luis (UNSL), Argentina
    details: |
      More than 25 years of experience in higher education, progressing from Teaching Assistant to Professor through successive academic promotions based on teaching, research, and service.
        - Teach undergraduate and postgraduate courses in Computer Science and Artificial Intelligence
        - Advise undergraduate and postgraduate students on research, thesis, and dissertation projects.
        - Researcher at Laboratorio de Investigación y Desarrollo en Inteligencia Computacional (LIDIC).
  
